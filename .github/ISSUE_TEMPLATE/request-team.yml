name: Request a Team / Season Sync
description: Request a PlayCricket team or grade to be added or updated in the SCA Digital Scorebook library.
title: "[Team Sync] "
labels: ["team-request"]
body:
  - type: markdown
    attributes:
      value: |
        **Easiest way:** Open **play.cricket.com.au/stats**, pick your Organisation, Season, and Grade/Team, then paste the page URL below (no exact typing needed!).
        **Or** leave the URL blank and fill in Organisation, Season, and Grade/Team (minor wording/order differences are matched automatically).

        Once a maintainer adds the **`approved`** label, GitHub Actions will fetch the games, enrich them with Scorecards & Ball-by-Ball data, and publish them to the live scorebook (~2–3 minutes).

  - type: input
    id: url
    attributes:
      label: PlayCricket Stats URL (easiest — optional)
      description: Paste the URL from play.cricket.com.au/stats after selecting your Org, Season, and Grade/Team. If provided, Organisation and Grade below can be left blank.
      placeholder: https://play.cricket.com.au/stats?cat=ballByBall&...
    validations:
      required: false

  - type: input
    id: org
    attributes:
      label: Organisation (Association or Club)
      description: Association or Club name on play.cricket.com.au/stats (skip if you pasted a URL above)
      placeholder: e.g. North Shore Junior Cricket Association
    validations:
      required: false

  - type: dropdown
    id: season
    attributes:
      label: Season
      description: PlayCricket Season (also used to name the library season folder)
      options:
        - Summer 2026/27
        - Summer 2025/26
        - Summer 2024/25
        - Summer 2023/24
        - Winter 2026
        - Winter 2025
      default: 0
    validations:
      required: true

  - type: input
    id: grade
    attributes:
      label: Grade or Club Team
      description: The Grade (for Associations) or Team (for Clubs/Rep Associations) — word-order & abbreviation tolerant (skip if you pasted a URL above)
      placeholder: e.g. Saturday U15 S3 20 Over  or  North Shore U13/1
    validations:
      required: false

  - type: input
    id: team
    attributes:
      label: Team Filter (optional)
      description: Only needed when selecting a whole Grade and you want to filter matches for one specific team
      placeholder: e.g. Mosman U10 Boland
    validations:
      required: false

  - type: input
    id: library_season
    attributes:
      label: Library Season Folder (optional)
      description: Leave blank to auto-derive from Season (e.g. "Summer 2026/27" -> "2026-27")
      placeholder: e.g. 2026-27
    validations:
      required: false

  - type: input
    id: library_team
    attributes:
      label: Library Team Name Override (optional)
      description: Leave blank to auto-detect the team name from the match CSVs
      placeholder: e.g. Mosman U10 Boland
    validations:
      required: false
